<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* A tiny focus sink */
      #sink {
        position: absolute;
        inset: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: transparent;
        caret-color: transparent;
      }
    </style>
  </head>
  <body>
    <input id="sink" autofocus />
    <script src="keycap.js"></script>
  </body>
</html>
